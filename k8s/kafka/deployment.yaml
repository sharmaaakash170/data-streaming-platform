apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: wurstmeister/kafka:latest
        resources:
          limits:
            memory: "2Gi"
            cpu: "2"
          requests:
            memory: "1Gi"
            cpu: "1"
        ports:
        - containerPort: 9093
        - containerPort: 9094
        env:
        - name: KAFKA_ADVERTISED_LISTENERS
          value: INSIDE-KAFKA://kafka-service.default.svc.cluster.local:9093,EXTERNAL-KAFKA://kafka-service.default.svc.cluster.local:9094
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL
          value: PLAINTEXT
        - name: KAFKA_LISTENER_NAME_EXTERNAL
          value: INSIDE-KAFKA
        - name: KAFKA_LISTENER_INTERNAL
          value: INTERNAL
        - name: KAFKA_LISTENER_PORT
          value: "9093"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: zookeeper-service.default.svc.cluster.local:2181
        - name: KAFKA_LISTENER_NAMES
          value: INSIDE-KAFKA,EXTERNAL-KAFKA
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: INSIDE-KAFKA:PLAINTEXT,EXTERNAL-KAFKA:PLAINTEXT
        - name: KAFKA_LISTENERS
          value: INSIDE-KAFKA://0.0.0.0:9093,EXTERNAL-KAFKA://0.0.0.0:9094
        - name: KAFKA_LISTENER_NAME_INTERNAL
          value: INSIDE-KAFKA
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: INSIDE-KAFKA
        - name: KAFKA_LOG4J_LOGGERS
          value: "kafka=DEBUG"
        - name: KAFKA_BROKER_ID
          value: "0"

        volumeMounts:
          - name: kafka-storage
            mountPath: /var/lib/kafka/data
      volumes:
        - name: kafka-storage
          persistentVolumeClaim:
            claimName: kafka-pvc






